<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090b12" />
    <meta name="description" content="A beautifully focused calculator." />
    <title>Calculator</title>
  </head>
  <body>
    <div class="ambient ambient--one" aria-hidden="true"></div>
    <div class="ambient ambient--two" aria-hidden="true"></div>

    <main class="app-shell">
      <section class="calculator" aria-label="Calculator">
        <button class="help-button" id="help-button" type="button" aria-label="Open calculator help">?</button>

        <div class="display" aria-live="polite" aria-atomic="true">
          <div class="display__expression" id="expression"></div>
          <output class="display__value" id="display">0</output>
        </div>

        <div class="keypad" id="keypad">
          <button class="key key--utility" data-action="clear" aria-label="Clear">AC</button>
          <button class="key key--utility" data-action="sign" aria-label="Toggle positive or negative">+/−</button>
          <button class="key key--utility" data-action="percent" aria-label="Percent">%</button>
          <button class="key key--operator" data-action="operator" data-value="÷" aria-label="Divide">÷</button>

          <button class="key" data-action="digit" data-value="7">7</button>
          <button class="key" data-action="digit" data-value="8">8</button>
          <button class="key" data-action="digit" data-value="9">9</button>
          <button class="key key--operator" data-action="operator" data-value="×" aria-label="Multiply">×</button>

          <button class="key" data-action="digit" data-value="4">4</button>
          <button class="key" data-action="digit" data-value="5">5</button>
          <button class="key" data-action="digit" data-value="6">6</button>
          <button class="key key--operator" data-action="operator" data-value="−" aria-label="Subtract">−</button>

          <button class="key" data-action="digit" data-value="1">1</button>
          <button class="key" data-action="digit" data-value="2">2</button>
          <button class="key" data-action="digit" data-value="3">3</button>
          <button class="key key--operator" data-action="operator" data-value="+" aria-label="Add">+</button>

          <button class="key key--zero" data-action="digit" data-value="0">0</button>
          <button class="key" data-action="decimal" aria-label="Decimal point">.</button>
          <button class="key key--equals" data-action="equals" aria-label="Equals">=</button>
        </div>
      </section>

      <dialog class="help-dialog" id="help-dialog" aria-labelledby="help-title">
        <div class="help-dialog__glow" aria-hidden="true"></div>
        <div class="help-dialog__header">
          <div>
            <span class="help-dialog__eyebrow">Quick guide</span>
            <h2 id="help-title">How to calculate</h2>
          </div>
          <button class="help-dialog__close" id="help-close" type="button" aria-label="Close help">×</button>
        </div>

        <p class="help-dialog__intro">Use the buttons or your keyboard. Results appear instantly when you press equals.</p>

        <div class="help-grid">
          <div class="help-item"><kbd>0–9</kbd><span>Enter numbers</span></div>
          <div class="help-item"><kbd>+ − × ÷</kbd><span>Choose an operation</span></div>
          <div class="help-item"><kbd>Enter</kbd><span>Show the result</span></div>
          <div class="help-item"><kbd>Esc</kbd><span>Clear everything</span></div>
        </div>

        <p class="help-dialog__note"><strong>Tip</strong> Use <span>+/−</span> to change a number’s sign and <span>%</span> to divide it by 100.</p>
      </dialog>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
